<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Benzineres més econòmiques</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fff3d6;
      color: #1d2733;
      padding: 12px 8px 20px;
    }

    .contenidor {
      max-width: 100%;
      margin: 0 auto;
    }

    .capcalera {
      text-align: center;
      margin-bottom: 14px;
    }

    .capcalera h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      color: #1f5fa8;
    }

    .subtitol {
      margin: 4px 0 0;
      color: #6b6b6b;
      font-size: 1rem;
    }

    .targeta {
      background: #fffdf7;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      padding: 14px;
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    label.camp {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
      font-weight: 600;
      gap: 4px;
      color: #444;
    }

    select {
      font-size: 1rem;
      padding: 10px;
      border: 1px solid #d8d2c2;
      border-radius: 10px;
      background: #fff;
    }

    .carburant {
      display: flex;
      gap: 12px;
      margin: 16px 0 4px;
    }

    .opcio {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border: 2px solid #1f5fa8;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      color: #1f5fa8;
      user-select: none;
    }

    .opcio input { margin: 0; accent-color: #1f5fa8; }

    .opcio:has(input:checked) {
      background: #1f5fa8;
      color: #fff;
    }

    button#consultar {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      background: #1f5fa8;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(31, 95, 168, 0.35);
    }

    button#consultar:hover { background: #184d8a; }

    .estat {
      font-size: 0.85rem;
      color: #6b6b6b;
      margin-top: 12px;
      text-align: center;
      min-height: 1em;
    }

    .error {
      color: #b03a2e;
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
    }

    .classificacio-titol {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1f5fa8;
      margin: 0 0 10px;
    }

    .taula-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      font-size: 0.8rem;
      color: #6b6b6b;
      padding: 6px 3px;
      border-bottom: 2px solid #e3dccb;
    }

    td {
      padding: 6px 3px;
      border-bottom: 1px solid #ece6d6;
      vertical-align: top;
      word-break: break-word;
    }

    td.preu, th.preu { text-align: right; }
    td.preu { font-weight: 700; white-space: nowrap; color: #1f5fa8; }
    td.num { color: #6b6b6b; width: 24px; }

    .apadrina {
      text-align: center;
    }

    .apadrina p {
      margin: 0 0 10px;
      font-size: 0.95rem;
      color: #3a3a3a;
    }

.apadrina a {
  display: inline-block;
  padding: 12px 20px;
  background: #e21b1b;
  color: #fff;
  text-decoration: none;
  font-weight: 700;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(226, 27, 27, 0.35);
}

    .apadrina a:hover { background: #b81515; }

    .credit {
      text-align: center;
      font-size: 0.75rem;
      color: #8a8270;
      margin-top: 16px;
    }

    /* Ordinador i tauletes (a partir de 700 px) */
    @media (min-width: 700px) {
      body {
        padding: 16px 12px 24px;
      }

      .contenidor {
        max-width: 960px;
      }

      .targeta {
        padding: 20px;
      }

      table {
        font-size: 0.95rem;
      }

      th, td {
        padding: 8px 6px;
      }

      td {
        word-break: normal;
      }
    }
  </style>
</head>
<body>
  <div class="contenidor">

    <header class="capcalera">
      <h1>Benzineres</h1>
      <p class="subtitol">Les més econòmiques de la teva zona</p>
    </header>

    <section class="targeta">
      <div class="controls">
        <label class="camp">Comarca
          <select id="comarca"></select>
        </label>
        <label class="camp">Municipi (opcional)
          <select id="municipi">
            <option value="">Tota la comarca</option>
          </select>
        </label>
      </div>

      <div class="carburant">
        <label class="opcio"><input type="radio" name="carburant" value="diesel" checked> Diesel</label>
        <label class="opcio"><input type="radio" name="carburant" value="super95"> Súper 95</label>
      </div>

      <button id="consultar">Consultar</button>

      <div id="estat" class="estat"></div>
      <div id="error" class="error"></div>
    </section>

    <section id="taula" class="targeta" hidden>
      <h2 class="classificacio-titol">Classificació</h2>
      <div class="taula-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Rètol</th>
              <th>Adreça</th>
              <th>Municipi</th>
              <th class="preu">€/l</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="targeta apadrina">
      <p>Campanya <strong>#RiuadadeNassos</strong>: ajuda a fer somriure als nens ingressats a l'hospital.</p>
      <a href="https://www.stockcrowd.com/p2p/1799/Apadrinaunsomriure" target="_blank" rel="noopener">Apadrina un somriure</a>
    </section>

    <footer class="credit">Web realitzada per Francesc Esteve</footer>

  </div>

  <script>
    const comarcaSel = document.getElementById('comarca');
    const municipiSel = document.getElementById('municipi');
    const estat = document.getElementById('estat');
    const errorDiv = document.getElementById('error');
    const taulaSeccio = document.getElementById('taula');
    const tbody = taulaSeccio.querySelector('tbody');
    let geo = {};

    function actualitzaMunicipis() {
      const llista = geo[comarcaSel.value] || [];
      municipiSel.innerHTML = '<option value="">Tota la comarca</option>';
      llista.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        municipiSel.appendChild(opt);
      });
    }

    async function carregaGeo() {
      const r = await fetch('api/geo');
      const data = await r.json();
      geo = data.comarques;
      comarcaSel.innerHTML = '';
      Object.keys(geo).sort().forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        comarcaSel.appendChild(opt);
      });
      actualitzaMunicipis();
    }

    async function consulta() {
      errorDiv.textContent = '';
      estat.textContent = 'Consultant...';
      const carburant = document.querySelector('input[name="carburant"]:checked').value;
      const params = new URLSearchParams({
        comarca: comarcaSel.value,
        municipi: municipiSel.value,
        carburant: carburant,
      });

      try {
        const r = await fetch('api/ranking?' + params.toString());
        const data = await r.json();
        if (!r.ok) {
          throw new Error(data.error || 'Error desconegut');
        }
        pinta(data);
      } catch (e) {
        taulaSeccio.hidden = true;
        estat.textContent = '';
        errorDiv.textContent = e.message;
      }
    }

    function pinta(data) {
      tbody.innerHTML = '';
      data.resultat.forEach((g, i) => {
        const tr = document.createElement('tr');

        const tdNum = document.createElement('td');
        tdNum.className = 'num';
        tdNum.textContent = i + 1;
        tr.appendChild(tdNum);

        [g.rotulo, g.adreca, g.municipi].forEach(v => {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        });

        const tdPreu = document.createElement('td');
        tdPreu.className = 'preu';
        tdPreu.textContent = g.preu.toFixed(3);
        tr.appendChild(tdPreu);

        tbody.appendChild(tr);
      });

      taulaSeccio.hidden = data.resultat.length === 0;
      estat.textContent = data.resultat.length
        ? `${data.total} estacions. Dades actualitzades: ${data.actualitzat}`
        : 'No s\'han trobat estacions amb preu per a aquesta selecció.';
    }

    comarcaSel.addEventListener('change', actualitzaMunicipis);
    document.getElementById('consultar').addEventListener('click', consulta);
    carregaGeo();
  </script>
</body>
</html>
